<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nifty 50 Index Scalper</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h1 { font-size: 1.2rem; margin: 0; color: #38bdf8; }
    .pill { background: #1e293b; color: #94a3b8; font-size: 0.75rem; padding: 4px 10px; border-radius: 999px; border: 1px solid #334155; }
    .card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid #334155; }
    .label { display: block; color: #94a3b8; font-size: 0.82rem; margin-bottom: 4px; }
    input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.95rem; margin-bottom: 12px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .btn-scan { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; }
    .btn-kite { background: #ff5722; color: #fff; margin-top: 12px; display: none; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #283548; font-size: 0.92rem; }
    .row:last-of-type { border-bottom: none; }
    .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; }
    .pass { background: #065f46; color: #6ee7b7; }
    .block { background: #7f1d1d; color: #fca5a5; }
    .note { font-size: 0.78rem; color: #94a3b8; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Nifty 50 Index Scalper</h1>
    <span class="pill">5m • 65 Qty/Lot</span>
  </div>

  <div class="card">
    <label class="label">Free Kite Publisher API Key</label>
    <input type="text" id="apiKeyInput" placeholder="Paste key from developers.kite.trade" />

    <label class="label">Max Risk Per Trade (₹)</label>
    <input type="number" id="maxRisk" value="800" min="100" step="50" />

    <label class="label">NFO Option Symbol Override (Optional)</label>
    <input type="text" id="customSymbol" placeholder="Leave blank for auto ATM Tuesday expiry" />

    <button class="btn-scan" id="scanBtn" onclick="runScan()">Scan NSE:NIFTY 50 Now</button>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="row"><span class="label">Gate Status</span><span id="statusBadge" class="badge"></span></div>
    <div class="row"><span class="label">IST Time</span><strong id="istTime">--</strong></div>
    <div class="row"><span class="label">Nifty 50 Spot</span><strong id="spotPrice">--</strong></div>
    <div class="row"><span class="label">20 EMA / 50 EMA</span><strong id="emas">--</strong></div>
    <div class="row"><span class="label">14 RSI / Trigger</span><strong id="rsiPattern">--</strong></div>
    <div class="row"><span class="label">Option Contract</span><strong id="optContract">--</strong></div>
    <div class="row"><span class="label">Position Size</span><strong id="lotQty">--</strong></div>
    <div class="row"><span class="label">Spot Target / Max SL</span><strong id="levels">--</strong></div>

    <form id="kiteForm" method="post" action="https://kite.zerodha.com/connect/basket" target="_blank" onsubmit="return attachKey()">
      <input type="hidden" id="kiteApiKey" name="api_key" value="" />
      <input type="hidden" id="basketData" name="data" value="" />
      <button type="submit" class="btn-kite" id="kiteBtn">Review & Place Order in Kite</button>
    </form>
    <div class="note">Place your SL & Target in Kite right after entry. Exit all MIS positions before 15:15 IST.</div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("kite_pub_key");
      const savedRisk = localStorage.getItem("nifty_max_risk");
      if (savedKey) document.getElementById("apiKeyInput").value = savedKey;
      if (savedRisk) document.getElementById("maxRisk").value = savedRisk;
    });

    function attachKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (!key) {
        alert("Paste your free Kite Publisher API Key first.");
        return false;
      }
      localStorage.setItem("kite_pub_key", key);
      document.getElementById("kiteApiKey").value = key;
      return true;
    }

    const NSE_HOLIDAYS = new Set([
      "2026-01-26", "2026-03-03", "2026-03-26", "2026-03-31",
      "2026-04-03", "2026-04-14", "2026-05-01", "2026-08-15",
      "2026-09-14", "2026-10-02", "2026-10-20", "2026-11-10",
      "2026-11-24", "2026-12-25"
    ]);

    function formatDateISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getActiveNiftySymbol(istDate, atmStrike, optType) {
      const d = new Date(istDate.getFullYear(), istDate.getMonth(), istDate.getDate());
      const diff = (2 - d.getDay() + 7) % 7;
      d.setDate(d.getDate() + diff);
      while (d.getDay() === 0 || d.getDay() === 6 || NSE_HOLIDAYS.has(formatDateISO(d))) {
        d.setDate(d.getDate() - 1);
      }
      const todayMid = new Date(istDate.getFullYear(), istDate.getMonth(), istDate.getDate());
      if (d < todayMid) {
        d.setDate(istDate.getDate() + ((2 - istDate.getDay() + 7) % 7 || 7));
        while (d.getDay() === 0 || d.getDay() === 6 || NSE_HOLIDAYS.has(formatDateISO(d))) {
          d.setDate(d.getDate() - 1);
        }
      }

      const yy = String(d.getFullYear()).slice(-2);
      const month = d.getMonth();
      const dd = String(d.getDate()).padStart(2, "0");

      const nextWeek = new Date(d);
      nextWeek.setDate(d.getDate() + 7);
      const isMonthly = nextWeek.getMonth() !== month;

      const mmmList = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
      const wCodeList = ["1","2","3","4","5","6","7","8","9","O","N","D"];

      if (isMonthly) {
        return `NIFTY${yy}${mmmList[month]}${atmStrike}${optType}`;
      }
      return `NIFTY${yy}${wCodeList[month]}${dd}${atmStrike}${optType}`;
    }

    function calcEMA(vals, period) {
      const k = 2 / (period + 1);
      let ema = vals.slice(0, period).reduce((a, b) => a + b, 0) / period;
      for (let i = period; i < vals.length; i++) ema = vals[i] * k + ema * (1 - k);
      return ema;
    }

    function calcRSI(closes, period = 14) {
      let gains = 0, losses = 0;
      for (let i = 1; i <= period; i++) {
        const d = closes[i] - closes[i - 1];
        if (d >= 0) gains += d; else losses -= d;
      }
      let avgG = gains / period, avgL = losses / period;
      for (let i = period + 1; i < closes.length; i++) {
        const d = closes[i] - closes[i - 1];
        avgG = (avgG * (period - 1) + Math.max(d, 0)) / period;
        avgL = (avgL * (period - 1) + Math.max(-d, 0)) / period;
      }
      return avgL === 0 ? 100 : +(100 - 100 / (1 + avgG / avgL)).toFixed(2);
    }

    function detectCandle(prev, curr) {
      const body = curr.c - curr.o, rng = curr.h - curr.l;
      if (rng <= 0) return "NONE";
      const lower = Math.min(curr.o, curr.c) - curr.l;
      const upper = curr.h - Math.max(curr.o, curr.c);
      if (prev.c < prev.o && curr.c > curr.o && curr.c >= prev.o && curr.o <= prev.c) return "BULLISH_ENGULFING";
      if (body > 0 && lower >= 2 * Math.abs(body) && upper <= 0.25 * rng) return "BULLISH_HAMMER";
      if (prev.c > prev.o && curr.c < curr.o && curr.o >= prev.c && curr.c <= prev.o) return "BEARISH_ENGULFING";
      if (body < 0 && upper >= 2 * Math.abs(body) && lower <= 0.25 * rng) return "SHOOTING_STAR";
      return "NONE";
    }

    async function runScan() {
      const btn = document.getElementById("scanBtn");
      const card = document.getElementById("resultCard");
      const badge = document.getElementById("statusBadge");
      const kiteBtn = document.getElementById("kiteBtn");

      const keyVal = document.getElementById("apiKeyInput").value.trim();
      if (keyVal) localStorage.setItem("kite_pub_key", keyVal);

      btn.innerText = "Scanning Nifty 50...";
      card.style.display = "block";
      kiteBtn.style.display = "none";

      try {
        const now = new Date();
        const ist = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
        const mins = ist.getHours() * 60 + ist.getMinutes();
        const day = ist.getDay();
        const isHoliday = NSE_HOLIDAYS.has(formatDateISO(ist));
        const inWindow = !isHoliday && day >= 1 && day <= 5 && mins >= 560 && mins <= 900;
        document.getElementById("istTime").innerText = ist.toTimeString().slice(0, 5) + " IST";

        const res = await fetch("https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?interval=5m&range=5d");
        const json = await res.json();
        const r = json.chart.result[0];
        const q = r.indicators.quote[0];
        const candles = r.timestamp.map((t, i) => ({
          o: q.open[i], h: q.high[i], l: q.low[i], c: q.close[i]
        })).filter(x => x.c != null);

        const closes = candles.map(x => x.c);
        const spot = +closes[closes.length - 1].toFixed(2);
        const ema20 = +calcEMA(closes, 20).toFixed(2);
        const ema50 = +calcEMA(closes, 50).toFixed(2);
        const rsi = calcRSI(closes, 14);
        const pattern = detectCandle(candles[candles.length - 2], candles[candles.length - 1]);

        document.getElementById("spotPrice").innerText = "₹" + spot;
        document.getElementById("emas").innerText = `${ema20} / ${ema50}`;
        document.getElementById("rsiPattern").innerText = `${rsi} | ${pattern}`;

        let optType = null, slPts = 8;
        const last = candles[candles.length - 1];
        if (ema20 > ema50 && rsi >= 45 && rsi <= 68 && ["BULLISH_ENGULFING", "BULLISH_HAMMER"].includes(pattern)) {
          optType = "CE";
          slPts = Math.min(8, Math.max(3, +(spot - last.l + 0.5).toFixed(1)));
        } else if (ema20 < ema50 && rsi >= 32 && rsi <= 55 && ["BEARISH_ENGULFING", "SHOOTING_STAR"].includes(pattern)) {
          optType = "PE";
          slPts = Math.min(8, Math.max(3, +(last.h - spot + 0.5).toFixed(1)));
        }

        const atm = Math.round(spot / 50) * 50;
        const maxRisk = parseFloat(document.getElementById("maxRisk").value) || 800;
        localStorage.setItem("nifty_max_risk", String(maxRisk));
        const estOptSl = +(slPts * 0.5).toFixed(2);
        const lots = Math.max(1, Math.floor(maxRisk / (estOptSl * 65)));
        const qty = lots * 65;

        const override = document.getElementById("customSymbol").value.trim().toUpperCase();
        const symbol = override || getActiveNiftySymbol(ist, atm, optType || "CE");

        document.getElementById("optContract").innerText = optType ? `${symbol} (ATM ${atm})` : "No Setup";
        document.getElementById("lotQty").innerText = `${lots} Lot(s) = ${qty} Qty`;
        document.getElementById("levels").innerText = `+12 pts Target / -${slPts} pts SL`;

        if (!inWindow) {
          badge.className = "badge block";
          badge.innerText = isHoliday ? "BLOCKED: NSE Holiday" : "BLOCKED: Outside 09:20–15:00 IST";
        } else if (!optType) {
          badge.className = "badge block";
          badge.innerText = "WAIT: No 20/50 EMA + Candle Trigger";
        } else {
          badge.className = "badge pass";
          badge.innerText = `PASS: BUY ${optType}`;
          document.getElementById("basketData").value = JSON.stringify([{
            variety: "regular",
            tradingsymbol: symbol,
            exchange: "NFO",
            transaction_type: "BUY",
            order_type: "MARKET",
            quantity: qty,
            product: "MIS",
            validity: "DAY"
          }]);
          kiteBtn.style.display = "block";
        }
      } catch (err) {
        badge.className = "badge block";
        badge.innerText = "ERROR: " + (err.message || "Network Failed");
      } finally {
        btn.innerText = "Scan NSE:NIFTY 50 Now";
      }
    }
  </script>
</body>
</html>
